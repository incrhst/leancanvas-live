<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EA5148"/>
      <stop offset="100%" stop-color="#D93D34"/>
    </linearGradient>
  </defs>

  <!-- Squircle rounded background matching Incrementic brand -->
  <rect width="512" height="512" rx="128" fill="url(#iconBg)"/>

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="8"/>

  <!-- High contrast white symbol: LC monogram + Canvas Grid icon -->
  <g transform="translate(96, 96)">
    <!-- Canvas grid lines -->
    <rect x="0" y="0" width="320" height="320" rx="40" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-opacity="0.9"/>
    
    <!-- Grid crossbars -->
    <line x1="160" y1="0" x2="160" y2="320" stroke="#FFFFFF" stroke-width="20" stroke-opacity="0.8"/>
    <line x1="0" y1="160" x2="320" y2="160" stroke="#FFFFFF" stroke-width="20" stroke-opacity="0.8"/>
    
    <!-- Pulse signal dot in center (Incrementic motif) -->
    <circle cx="160" cy="160" r="32" fill="#FFFFFF"/>
  </g>
</svg>
